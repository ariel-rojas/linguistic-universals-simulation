[project]
name = "universals-study"
version = "0.1.0"
description = "Simulación de universales lingüísticos bajo dependencia filogenética"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.84",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
]

[project.scripts]
universals-study = "universals_study.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
